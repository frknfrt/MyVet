name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myvet
          POSTGRES_USER: myvet
          POSTGRES_PASSWORD: myvet
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U myvet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend testleri
        working-directory: backend
        run: ./mvnw -B test
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: myvet
          DB_USER: myvet
          DB_PASSWORD: myvet
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Klinik uçtan uca senaryolar
        env:
          DB_PORT: 5433
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          (cd backend && ./mvnw -B spring-boot:run) > "$RUNNER_TEMP/vetly-e2e.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for i in {1..90}; do
            if curl -fsS http://localhost:8080/v3/api-docs > /dev/null; then break; fi
            sleep 2
          done
          cd frontend && npm run test:e2e
      - name: Docker imajini dogrula
        working-directory: backend
        run: docker build -t myvet-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm test

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
