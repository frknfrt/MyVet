spring:
  application:
    name: myvet-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:myvet}
    username: ${DB_USER:myvet}
    password: ${DB_PASSWORD:myvet}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  task:
    scheduling:
      pool:
        # Varsayilan 1 -- bu dal 3 modulde 4 yeni @Scheduled is ekledi (bazilari
        # 2 dakikada bir calisiyor), toplam 6 zamanlanmis is oldu. Tek thread'de
        # yavas bir is digerlerini geciktirir -- havuzu buyutuyoruz.
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never

app:
  # Davet e-postasindaki kabul linki gibi frontend'e donen URL'ler icin.
  # Prod'da FRONTEND_BASE_URL env degiskeniyle mutlaka override edilmeli.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # vetly.com'dan gelen CORS istekleri icin (public signup akisi). Prod'da
  # VETLY_SITE_ORIGIN env degiskeniyle mutlaka override edilmeli.
  vetly-site-origin: ${VETLY_SITE_ORIGIN:http://localhost:5175}

jwt:
  # Prod'da JWT_SECRET env degiskeniyle mutlaka override edilmeli.
  secret: ${JWT_SECRET:myvet-local-dev-secret-key-change-me-32bytes-min}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

ai:
  # Hangi saglayici adaptorunun (SoapGenerationPort/TreatmentRecommendationPort)
  # aktif olacagini secer: "ollama" (varsayilan, yerel/ucretsiz) veya "claude"
  # (Anthropic API, ucretli ama VRAM siniri yok). Ikisi ayni anda aktif olamaz --
  # bkz. OllamaSoapGenerationAdapter/ClaudeSoapGenerationAdapter @ConditionalOnProperty.
  provider: ${AI_PROVIDER:ollama}
  ollama:
    # Lokal Ollama'ya baglanmak icin OLLAMA_BASE_URL=http://localhost:11434 set edin.
    # Bos birakilirsa (varsayilan) SOAP uretimi mock/simule modda kalir
    # (bkz. OllamaSoapGenerationAdapter).
    base-url: ${OLLAMA_BASE_URL:}
    model: ${OLLAMA_MODEL:llama3.1}
  anthropic:
    # ai.provider=claude oldugunda kullanilir. ANTHROPIC_API_KEY asla commit
    # edilmemeli -- backend/.env.local (gitignored) veya ortam degiskeni olarak
    # verilmeli.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}

efatura:
  # Hangi saglayici adaptorunun (EInvoiceGatewayPort) aktif olacagini secer:
  # "mock" (varsayilan, gercekci simulasyon) veya "faturaentegrator" (gercek
  # API, faturaentegrator.com). Ikisi ayni anda aktif olamaz -- bkz.
  # MockEInvoiceGatewayAdapter/FaturaEntegratorEInvoiceGatewayAdapter
  # @ConditionalOnProperty.
  provider: ${EFATURA_PROVIDER:mock}
  faturaentegrator:
    # efatura.provider=faturaentegrator oldugunda kullanilir. API anahtari
    # panelde (app.faturaentegrator.com > Ayarlar > Entegrasyon/API) uretilir,
    # ASLA commit edilmemeli -- ortam degiskeni olarak verilmeli.
    api-key: ${EFATURA_FATURAENTEGRATOR_API_KEY:}
    # Panelde eklenen fatura hesabinin (Test Entegratör/Dummy Fatura ya da
    # gercek entegrator) ID'si.
    invoice-integration-id: ${EFATURA_FATURAENTEGRATOR_INVOICE_INTEGRATION_ID:0}
    # Panelde tanimlanan "API (Ozel Entegrasyon)" satis kanalinin ID'si.
    sale-channel-id: ${EFATURA_FATURAENTEGRATOR_SALE_CHANNEL_ID:0}
    # faturaentegrator'in asenkron callback_url bildirimini gonderecegi adres
    # icin backend'in disaridan erisilebilir gercek adresi (Render'da
    # https://<servis-adi>.onrender.com gibi) -- prod'da mutlaka set edilmeli.
    callback-base-url: ${EFATURA_FATURAENTEGRATOR_CALLBACK_BASE_URL:http://localhost:8080}

notification:
  twilio:
    # WhatsApp Sandbox icin: TWILIO_ACCOUNT_SID/TWILIO_AUTH_TOKEN bos
    # birakilirsa gonderim simule edilir (bkz. TwilioNotificationAdapter).
    # TWILIO_AUTH_SID: API Key kullaniliyorsa (SK... ile baslayan), Account
    # SID'den (AC...) FARKLI bir Basic Auth kullanici adi gerekir -- bos
    # birakilirsa TWILIO_ACCOUNT_SID kullanilir (klasik Account SID + Auth
    # Token modu).
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-sid: ${TWILIO_AUTH_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
    # Onayli WhatsApp Content Template SID'i (HX... ile baslar). Bos birakilirsa
    # serbest metin ("Body") gonderilir -- bu YALNIZCA aliciyla acik bir 24 saatlik
    # "musteri hizmeti penceresi" varken calisir (ornegin sandbox'a "join" mesaji
    # atildiktan sonraki 24 saat icinde). Pencere kapaliysa Twilio 21654 hatasi
    # ("ContentSid Required") doner -- bunu kalici cozmek icin Twilio Content
    # Template Builder'da bir sablon onaylatip SID'ini buraya verin.
    whatsapp-content-sid: ${TWILIO_WHATSAPP_CONTENT_SID:}
  ileti-merkezi:
    # SMS gonderimi icin. Bos birakilirsa (varsayilan) SMS gonderimi simule
    # edilir (bkz. TwilioNotificationAdapter.sendSmsViaIletiMerkezi). Ayni
    # ILETI_MERKEZI_* env degiskenleri platform-billing.ileti-merkezi
    # tarafindan da kullanilir -- tek hesap, iki izole istemci (bkz.
    # PlatformBillingSmsPort'un "paralel altyapi" javadoc'u).
    api-key: ${ILETI_MERKEZI_API_KEY:}
    hash: ${ILETI_MERKEZI_HASH:}
    sender: ${ILETI_MERKEZI_SENDER:vetly}

platform-admin:
  # Uygulama ilk ayaga kalktiginda platform_admin_users bosken bu bilgilerle
  # tek bir hesap olusturulur. Prod'da PLATFORM_ADMIN_EMAIL/PASSWORD env
  # degiskenleriyle mutlaka override edilmeli.
  bootstrap-email: ${PLATFORM_ADMIN_EMAIL:admin@myvet.local}
  bootstrap-password: ${PLATFORM_ADMIN_PASSWORD:change-me-local-dev-only}
  bootstrap-full-name: ${PLATFORM_ADMIN_FULL_NAME:Platform Admin}

server:
  # Render (ve benzeri container platformlari) uygulamanin PORT ortam
  # degiskeninde belirttikleri porta baglanmasini bekliyor -- SERVER_PORT
  # yerel/diger ortamlar icin geriye donuk uyumluluk olarak korunuyor.
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    com.vetos: debug
  pattern:
    correlation: "[%X{requestId:-etc.}/%X{tenantId:-sistem}] "

platform-billing:
  # Otomatik kart cekimi yok -- fatura e-posta/SMS bildirimlerinde gosterilen
  # sabit odeme talimati. Gercek/coklu banka hesabi yonetimi kapsam disi.
  payment-instructions: >
    Odemenizi IBAN TR00 0000 0000 0000 0000 0000 00 (Vetly Yazilim A.S.) hesabina
    yapip aciklama kismina klinik adinizi yazmaniz yeterlidir.
  ileti-merkezi:
    # Platform fatura SMS'leri icin -- notification.ileti-merkezi ile ayni
    # ILETI_MERKEZI_* env degiskenlerini kullanir ama bilincli olarak ayri
    # bir istemci uzerinden gonderir (bkz. PlatformBillingSmsPort).
    api-key: ${ILETI_MERKEZI_API_KEY:}
    hash: ${ILETI_MERKEZI_HASH:}
    sender: ${ILETI_MERKEZI_SENDER:vetly}

payment-gateway:
  iyzico:
    # UYARI: bos birakilirsa checkout tamamen simule edilir ve
    # /api/v1/public/payments/iyzico/callback GET ile "?token=SIMULATED-<herhangi-bir-fatura-id>"
    # cagrilarak HERHANGI BIR FATURA BEDAVA ODENMIS ISARETLENEBILIR (bkz.
    # IyzicoPaymentGatewayAdapter.isConfigured()) -- gelistirme/CI icin
    # bilincli bir tasarim, ama prod'da IYZICO_API_KEY/IYZICO_SECRET_KEY
    # mutlaka set edilmeli (JWT_SECRET/PLATFORM_ADMIN_PASSWORD ile ayni
    # operasyonel gereklilik).
    api-key: ${IYZICO_API_KEY:}
    secret-key: ${IYZICO_SECRET_KEY:}
    base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
    # iyzico'nun callback POST'u bu adrese gelir -- prod'da backend'in
    # disaridan erisilebilir gercek adresiyle override edilmeli.
    callback-base-url: ${IYZICO_CALLBACK_BASE_URL:http://localhost:8080}
