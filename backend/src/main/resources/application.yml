spring:
  application:
    name: myvet-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:myvet}
    username: ${DB_USER:myvet}
    password: ${DB_PASSWORD:myvet}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

jwt:
  # Prod'da JWT_SECRET env degiskeniyle mutlaka override edilmeli.
  secret: ${JWT_SECRET:myvet-local-dev-secret-key-change-me-32bytes-min}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.vetos: debug
