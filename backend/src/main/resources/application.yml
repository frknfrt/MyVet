spring:
  application:
    name: myvet-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:myvet}
    username: ${DB_USER:myvet}
    password: ${DB_PASSWORD:myvet}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  task:
    scheduling:
      pool:
        # Varsayilan 1 -- bu dal 3 modulde 4 yeni @Scheduled is ekledi (bazilari
        # 2 dakikada bir calisiyor), toplam 6 zamanlanmis is oldu. Tek thread'de
        # yavas bir is digerlerini geciktirir -- havuzu buyutuyoruz.
        size: 4

  lifecycle:
    # server.shutdown=graceful ile: devam eden HTTP istekleri ve async gorevler
    # icin en fazla bu kadar beklenir (VPS'teki systemd TimeoutStopSec'ten kisa olmali).
    timeout-per-shutdown-phase: 30s

management:
  # Actuator ayri portta ve sadece localhost'ta (spec 2026-10-14 S4.2). Disariya nginx yalnizca
  # /health/ready ve /health/external'i acar; metrikler sadece sunucunun icinden okunur.
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        # Pasif dis servis kontrolu (IntegrationOutcomes). Readiness'a bilerek girmez:
        # iyzico dustu diye uygulama "hazir degil" sayilmamali.
        external:
          include: efatura,sms,whatsapp,ai,payment
  metrics:
    tags:
      application: vetly

app:
  # Davet e-postasindaki kabul linki gibi frontend'e donen URL'ler icin.
  # Prod'da FRONTEND_BASE_URL env degiskeniyle mutlaka override edilmeli.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # vetly.com'dan gelen CORS istekleri icin (public signup akisi). Prod'da
  # VETLY_SITE_ORIGIN env degiskeniyle mutlaka override edilmeli.
  vetly-site-origin: ${VETLY_SITE_ORIGIN:http://localhost:5175}

jwt:
  # Prod'da JWT_SECRET env degiskeniyle mutlaka override edilmeli.
  secret: ${JWT_SECRET:myvet-local-dev-secret-key-change-me-32bytes-min}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

ai:
  # Hangi saglayici adaptorunun (SoapGenerationPort/TreatmentRecommendationPort)
  # aktif olacagini secer: "ollama" (varsayilan, yerel/ucretsiz) veya "claude"
  # (Anthropic API, ucretli ama VRAM siniri yok). Ikisi ayni anda aktif olamaz --
  # bkz. OllamaSoapGenerationAdapter/ClaudeSoapGenerationAdapter @ConditionalOnProperty.
  provider: ${AI_PROVIDER:ollama}
  ollama:
    # Lokal Ollama'ya baglanmak icin OLLAMA_BASE_URL=http://localhost:11434 set edin.
    # Bos birakilirsa (varsayilan) SOAP uretimi mock/simule modda kalir
    # (bkz. OllamaSoapGenerationAdapter).
    base-url: ${OLLAMA_BASE_URL:}
    model: ${OLLAMA_MODEL:llama3.1}
    # Lab/goruntuleme sonuc fotografindan AI ile otomatik doldurma (2026-10-29):
    # gorsel (vision) model metin modelinden FARKLI olabilir (ornek: llava,
    # llama3.2-vision) -- tam model adi ve CPU performansi yerel olarak test
    # edilip buraya/env'e yazilmali. Vision cagrilari CPU'da metin cagrilarindan
    # cok daha yavas olabilir, bu yuzden okuma zaman asimi daha yuksek tutulur.
    vision-model: ${OLLAMA_VISION_MODEL:llava}
    vision-timeout-seconds: ${OLLAMA_VISION_TIMEOUT_SECONDS:120}
  anthropic:
    # ai.provider=claude oldugunda kullanilir. ANTHROPIC_API_KEY asla commit
    # edilmemeli -- backend/.env.local (gitignored) veya ortam degiskeni olarak
    # verilmeli.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}

efatura:
  # Hangi saglayici adaptorunun (EInvoiceGatewayPort) aktif olacagini secer:
  # "mock" (varsayilan, gercekci simulasyon) veya "faturaentegrator" (gercek
  # API, faturaentegrator.com). Ikisi ayni anda aktif olamaz -- bkz.
  # MockEInvoiceGatewayAdapter/FaturaEntegratorEInvoiceGatewayAdapter
  # @ConditionalOnProperty.
  provider: ${EFATURA_PROVIDER:mock}
  faturaentegrator:
    # efatura.provider=faturaentegrator oldugunda kullanilir. API anahtari
    # panelde (app.faturaentegrator.com > Ayarlar > Entegrasyon/API) uretilir,
    # ASLA commit edilmemeli -- ortam degiskeni olarak verilmeli.
    api-key: ${EFATURA_FATURAENTEGRATOR_API_KEY:}
    # Panelde eklenen fatura hesabinin (Test Entegratör/Dummy Fatura ya da
    # gercek entegrator) ID'si.
    invoice-integration-id: ${EFATURA_FATURAENTEGRATOR_INVOICE_INTEGRATION_ID:0}
    # Panelde tanimlanan "API (Ozel Entegrasyon)" satis kanalinin ID'si.
    sale-channel-id: ${EFATURA_FATURAENTEGRATOR_SALE_CHANNEL_ID:0}
    # faturaentegrator'in asenkron callback_url bildirimini gonderecegi adres
    # icin backend'in disaridan erisilebilir gercek adresi (Render'da
    # https://<servis-adi>.onrender.com gibi) -- prod'da mutlaka set edilmeli.
    callback-base-url: ${EFATURA_FATURAENTEGRATOR_CALLBACK_BASE_URL:http://localhost:8080}

notification:
  meta:
    # Meta WhatsApp Cloud API (Graph API). META_WHATSAPP_ACCESS_TOKEN/
    # META_WHATSAPP_PHONE_NUMBER_ID bos birakilirsa gonderim simule edilir
    # (bkz. NotificationProviderAdapter). access-token, WhatsApp Business
    # hesabina "whatsapp_business_messaging" izniyle baglanmis bir System
    # User'in kalici tokeni olmali (App Dashboard'daki gecici test tokeni
    # ~24 saatte suresi doluyor, sadece yerel gelistirme/test icin uygundur).
    access-token: ${META_WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${META_WHATSAPP_API_VERSION:v25.0}
    # Onayli bir WhatsApp Message Template adi. Bos birakilirsa serbest metin
    # ("text") gonderilir -- bu YALNIZCA aliciyla acik bir 24 saatlik "musteri
    # hizmeti penceresi" varken calisir (alicinin business numarasina son 24
    # saat icinde bir mesaj atmis olmasi gerekir). Pencere kapaliysa Meta
    # 131047 hatasi ("re-engagement message") doner -- bunu kalici cozmek
    # icin Meta Business Manager'da tek degiskenli (orn. "Bildirim: {{1}}")
    # bir sablon onaylatip adini buraya verin.
    template-name: ${META_WHATSAPP_TEMPLATE_NAME:}
    template-language: ${META_WHATSAPP_TEMPLATE_LANGUAGE:en_US}
  ileti-merkezi:
    # SMS gonderimi icin. Bos birakilirsa (varsayilan) SMS gonderimi simule
    # edilir (bkz. NotificationProviderAdapter.sendSmsViaIletiMerkezi). Ayni
    # ILETI_MERKEZI_* env degiskenleri platform-billing.ileti-merkezi
    # tarafindan da kullanilir -- tek hesap, iki izole istemci (bkz.
    # PlatformBillingSmsPort'un "paralel altyapi" javadoc'u).
    api-key: ${ILETI_MERKEZI_API_KEY:}
    hash: ${ILETI_MERKEZI_HASH:}
    sender: ${ILETI_MERKEZI_SENDER:vetly}

platform-admin:
  # Uygulama ilk ayaga kalktiginda platform_admin_users bosken bu bilgilerle
  # tek bir hesap olusturulur. Prod'da PLATFORM_ADMIN_EMAIL/PASSWORD env
  # degiskenleriyle mutlaka override edilmeli.
  bootstrap-email: ${PLATFORM_ADMIN_EMAIL:admin@myvet.local}
  bootstrap-password: ${PLATFORM_ADMIN_PASSWORD:change-me-local-dev-only}
  bootstrap-full-name: ${PLATFORM_ADMIN_FULL_NAME:Platform Admin}

server:
  # Render (ve benzeri container platformlari) uygulamanin PORT ortam
  # degiskeninde belirttikleri porta baglanmasini bekliyor -- SERVER_PORT
  # yerel/diger ortamlar icin geriye donuk uyumluluk olarak korunuyor.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

logging:
  level:
    com.vetos: debug
  # LOG_FORMAT=ecs -> Spring Boot yerlesik JSON (ECS); bos -> asagidaki duz metin deseni.
  structured:
    format:
      console: ${LOG_FORMAT:}
    json:
      customizer: com.vetos.platform.observability.PiiMaskingJsonMembersCustomizer
  pattern:
    # Spring Boot varsayilan deseni + requestId/tenantId + mesajdaki 11 haneli sayilarin
    # maskelenmesi (regex LogMasking.ELEVEN_DIGIT_REGEX ile ayni; ObservabilityWiringTest dogrular).
    console: >-
      %clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%15.15t]){faint}
      [%X{requestId:-etc.}/%X{tenantId:-sistem}] %clr(%-40.40logger{39}){cyan} %clr(:){faint}
      %replace(%m){'(?<!\d)(\d{3})\d{6}(\d{2})(?!\d)', '$1******$2'}%n%wEx

platform-billing:
  # Otomatik kart cekimi yok -- fatura e-posta/SMS bildirimlerinde gosterilen
  # sabit odeme talimati. Gercek/coklu banka hesabi yonetimi kapsam disi.
  payment-instructions: >
    Odemenizi IBAN TR00 0000 0000 0000 0000 0000 00 (Vetly Yazilim A.S.) hesabina
    yapip aciklama kismina klinik adinizi yazmaniz yeterlidir.
  ileti-merkezi:
    # Platform fatura SMS'leri icin -- notification.ileti-merkezi ile ayni
    # ILETI_MERKEZI_* env degiskenlerini kullanir ama bilincli olarak ayri
    # bir istemci uzerinden gonderir (bkz. PlatformBillingSmsPort).
    api-key: ${ILETI_MERKEZI_API_KEY:}
    hash: ${ILETI_MERKEZI_HASH:}
    sender: ${ILETI_MERKEZI_SENDER:vetly}

payment-gateway:
  iyzico:
    # UYARI: bos birakilirsa checkout tamamen simule edilir ve
    # /api/v1/public/payments/iyzico/callback GET ile "?token=SIMULATED-<herhangi-bir-fatura-id>"
    # cagrilarak HERHANGI BIR FATURA BEDAVA ODENMIS ISARETLENEBILIR (bkz.
    # IyzicoPaymentGatewayAdapter.isConfigured()) -- gelistirme/CI icin
    # bilincli bir tasarim, ama prod'da IYZICO_API_KEY/IYZICO_SECRET_KEY
    # mutlaka set edilmeli (JWT_SECRET/PLATFORM_ADMIN_PASSWORD ile ayni
    # operasyonel gereklilik).
    api-key: ${IYZICO_API_KEY:}
    secret-key: ${IYZICO_SECRET_KEY:}
    base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
    # iyzico'nun callback POST'u bu adrese gelir -- prod'da backend'in
    # disaridan erisilebilir gercek adresiyle override edilmeli.
    callback-base-url: ${IYZICO_CALLBACK_BASE_URL:http://localhost:8080}

admin-email:
  # UYARI: host + port + UCU DE kutunun kullanici adi/sifresi birlikte set
  # edilmedikce gercek SMTP gonderimi devreye girmez, admin panelinden "Gonder"
  # istegi sadece loglanir (bkz. SmtpAdminEmailAdapter.isConfigured()) --
  # IyzicoPaymentGatewayAdapter'daki ayni "bos ise simule et" deseni.
  # cPanel'deki E-posta Hesaplari > (kutu) > Baglan/Yapilandir ekraninda
  # gorunen sunucu adi/port buraya; kullanici adi genelde kutunun tam
  # adresi (ornek: info@vetly.com.tr), sifre o kutunun mail sifresidir.
  smtp-host: ${ADMIN_EMAIL_SMTP_HOST:}
  smtp-port: ${ADMIN_EMAIL_SMTP_PORT:465}
  info:
    username: ${ADMIN_EMAIL_INFO_USERNAME:}
    password: ${ADMIN_EMAIL_INFO_PASSWORD:}
  destek:
    username: ${ADMIN_EMAIL_DESTEK_USERNAME:}
    password: ${ADMIN_EMAIL_DESTEK_PASSWORD:}
  bildirim:
    username: ${ADMIN_EMAIL_BILDIRIM_USERNAME:}
    password: ${ADMIN_EMAIL_BILDIRIM_PASSWORD:}

features:
  enforcement:
    # Plan "Modul Erisimi" isaretlerinin kliniklere uygulanmasi. Mevcut paketlerin
    # isaretleri admin panelinden duzenlenmeden ACILMAMALI (bos isaretli paketteki
    # odeme yapan klinikler kilitlenir). Kapaliyken her klinikte her modul acik.
    enabled: ${FEATURES_ENFORCEMENT_ENABLED:false}

vetly:
  # Kiraci basina koruma sinirlari (bellek-ici, herkese ayni) -- spec 2026-10-15 §1.
  # Env ile degistirilebilir: VETLY_RATE_LIMIT_TENANT_GENERAL_PER_MINUTE vb.
  rate-limit:
    tenant-general-per-minute: 600
    tenant-ai-per-minute: 10
    campaign-recipients-per-hour: 2000

  # Paket kotalari: degerler admin panelinden (Paket Yonetimi). TRIAL'in plans satiri
  # olmadigi icin deneme kotalari burada. Env: VETLY_QUOTA_TRIAL_AI / VETLY_QUOTA_TRIAL_MESSAGE.
  quota:
    trial:
      ai: 30
      message: 100
  # Faz 7 (spec 2026-10-18): TARBIL eklentisi icin en dusuk surum. Bundan eski eklenti 426 alir.
  # Yukseltmeden ONCE yeni surum Vetly'den indirilebilir olmali (docs/api-conventions.md Versiyonlama).
  extension:
    min-version: ${VETLY_EXTENSION_MIN_VERSION:0.3.0}

# Faz 5 (spec 2026-10-16): dis servis korumasi. Kod programatik sarar (anotasyon yok).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: false
        # Kesinti-disi hatalar (400, ayristirma hatasi) breaker icin BASARI sayilir (servis cevap verdi) --
        # bilincli tercih; bunlar devreyi asla acmaz.
        record-failure-predicate: com.vetos.platform.resilience.OutageFailurePredicate
    instances:
      ai:
        base-config: default
        slow-call-duration-threshold: 30s
      payment:
        base-config: default
        slow-call-duration-threshold: 10s
      efatura:
        base-config: default
        slow-call-duration-threshold: 20s
  bulkhead:
    instances:
      ai:
        max-concurrent-calls: 4
        max-wait-duration: 10s
  retry:
    configs:
      read:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: com.vetos.platform.resilience.OutageFailurePredicate
    instances:
      payment-read:
        base-config: read
      efatura-read:
        base-config: read
