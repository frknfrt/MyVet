# com.vetos.modules.<isim> paketleri dogrudan com.vetos'un alt paketi degil,
# bir seviye ic ice (architecture.md Bolum 2). Bu yuzden otomatik "direct
# sub-packages" tespiti yerine, her modulu kendi package-info.java'sindaki
# @ApplicationModule ile acikca isaretliyoruz. com.vetos.platform.* hicbir
# zaman @ApplicationModule almaz -- boylece butun moduller tarafindan serbestce
# kullanilabilen ortak altyapi (cross-cutting) olarak kalir.
spring.modulith.detection-strategy=explicitly-annotated
